<!DOCTYPE html>
<html lang="en">    
<head>
  <meta charset="UTF-8">
  <title>Language Redirect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .voucher {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 20, 40, 0.15);
      padding: 30px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #0b1a2e;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #2d4055;
      margin-bottom: 20px;
    }
    .links a {
      display: inline-block;
      margin: 8px;
      padding: 12px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .btn-es {
      background: #00b4ff;
      color: white;
    }
    .btn-es:hover {
      background: #0099dd;
    }
    .btn-en {
      background: #eef2f6;
      color: #0b1a2e;
    }
    .btn-en:hover {
      background: #d9e2ec;
    }
    .counter {
      font-size: 14px;
      color: #4a5f77;
      margin-top: 15px;
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var userLang = navigator.language || navigator.userLanguage;
      userLang = userLang.toLowerCase();
      var targetUrl = userLang.startsWith("es") ? "index-es.html" : "index-en.html";

      // Intento redirigir
      try {
        window.location.href = targetUrl;
      } catch (e) {
        // Si no redirige, muestro enlaces y contador
        var countdown = 3;
        var counterEl = document.getElementById("counter");
        counterEl.textContent = countdown;
        var interval = setInterval(function() {
          countdown--;
          counterEl.textContent = countdown;
          if (countdown <= 0) {
            clearInterval(interval);
            window.location.href = targetUrl;
          }
        }, 1000);
        document.getElementById("links").style.display = "block";
      }
    });
  </script>
</head>
<body>
  <div class="voucher">
    <h1>Language Detection</h1>
    <p>Detectando idioma de la sesión...</p>
    <div id="links" style="display:none;">
      <p>Accede manualmente si no se redirige:</p>
      <div class="links">
        <a href="index-es.html" class="btn-es">Versión en Español</a>
        <a href="index-en.html" class="btn-en">English Version</a>
      </div>
      <div class="counter">Redirección automática en <span id="counter"></span> segundos...</div>
    </div>
  </div>
</body>
</html>
